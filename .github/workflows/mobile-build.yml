name: Mobile builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:sync:android
      - name: Build installable test APK and unsigned store bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: a-challenge-android-test-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select installed Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npm run mobile:sync:ios
      - name: Build unsigned iPhone simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile-artifacts/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: a-challenge-ios-simulator-build
          path: mobile-artifacts/ios/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error
